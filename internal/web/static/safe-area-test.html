<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safe Area Insets Test</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #e4e4ed;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .info {
    padding: 16px;
    text-align: center;
    font-size: 14px;
    color: #9e9eae;
  }
  .zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: relative;
    outline: 3px dashed rgba(255,255,255,0.5);
    outline-offset: -8px;
  }
  .zone::after {
    content: attr(data-label);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.5);
    padding: 4px 12px;
    border-radius: 4px;
  }
  .zone-top {
    background: rgba(239, 68, 68, 0.2);
    height: max(20px, env(safe-area-inset-top, 0px));
  }
  .zone-bottom {
    background: rgba(16, 185, 129, 0.2);
    height: max(20px, env(safe-area-inset-bottom, 0px));
  }
  .zone-left {
    background: rgba(59, 130, 246, 0.2);
    width: max(20px, env(safe-area-inset-left, 0px));
  }
  .zone-right {
    background: rgba(245, 158, 11, 0.2);
    width: max(20px, env(safe-area-inset-right, 0px));
  }
  .main-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(79, 70, 229, 0.1);
  }
  .layout-row {
    display: flex;
    flex: 1;
  }
  .layout-col {
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .env-values {
    padding: 16px;
    background: #16213e;
    text-align: center;
    font-size: 12px;
    font-family: monospace;
    color: #34d399;
  }
  .env-values span {
    display: block;
    margin: 4px 0;
  }
  .header {
    padding: 12px 16px;
    background: #16213e;
    text-align: center;
    font-weight: 600;
    font-size: 16px;
  }
</style>
</head>
<body>
  <div class="header">Safe Area Insets Visual Test</div>

  <!-- Top safe area -->
  <div class="zone zone-top" data-label="safe-area-inset-top"></div>

  <div class="layout-row">
    <!-- Left safe area -->
    <div class="zone zone-left" data-label="safe-area-inset-left"></div>

    <!-- Main content -->
    <div class="layout-col">
      <div class="main-area">
        <div class="env-values">
          <span>safe-area-inset-top: <b id="val-top">--</b>px</span>
          <span>safe-area-inset-bottom: <b id="val-bottom">--</b>px</span>
          <span>safe-area-inset-left: <b id="val-left">--</b>px</span>
          <span>safe-area-inset-right: <b id="val-right">--</b>px</span>
        </div>
      </div>
    </div>

    <!-- Right safe area -->
    <div class="zone zone-right" data-label="safe-area-inset-right"></div>
  </div>

  <!-- Bottom safe area -->
  <div class="zone zone-bottom" data-label="safe-area-inset-bottom"></div>

  <div class="info">
    Dashed outlines show safe area zones. On devices with no notch or rounded corners,
    these areas will be zero (minimum 20px shown for visibility).
  </div>

  <script>
    // Read computed safe-area values from CSS environment variables
    function updateValues() {
      var style = getComputedStyle(document.documentElement);
      document.getElementById('val-top').textContent =
        style.getPropertyValue('--safe-area-inset-top') || '0';
      document.getElementById('val-bottom').textContent =
        style.getPropertyValue('--safe-area-inset-bottom') || '0';
      document.getElementById('val-left').textContent =
        style.getPropertyValue('--safe-area-inset-left') || '0';
      document.getElementById('val-right').textContent =
        style.getPropertyValue('--safe-area-inset-right') || '0';
    }
    updateValues();
    window.addEventListener('resize', updateValues);
  </script>
</body>
</html>
