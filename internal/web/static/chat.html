<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>claw-code-go — Chat</title>
<link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>
  <header id="top-bar">
    <button id="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">☰</button>
    <h1>claw-code-go</h1>
    <span id="connection-status" class="status-pill status-connected">connected</span>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <nav>
        <h2>Sessions</h2>
        <ul id="session-list">
          <li class="session-item active">Current session</li>
        </ul>
        <button id="new-session-btn" aria-label="Start a new chat session">+ New session</button>
      </nav>
    </aside>

    <main id="messages" aria-live="polite" role="log">
      <!-- Messages are inserted here by JS -->
    </main>
  </div>

  <footer>
    <form id="composer" autocomplete="off">
      <div id="composer-wrapper">
        <textarea
          id="composer-input"
          rows="1"
          placeholder="Ask claw-code-go…"
          aria-label="Message input"
          maxlength="100000"
        ></textarea>
        <span id="char-count" class="char-count-hidden" aria-live="polite"></span>
      </div>
      <button type="submit" id="send-button" aria-label="Send message" title="Send message">
        ↑
      </button>
    </form>
  </footer>

  <script>
    // Register the service worker for PWA offline support.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
        .then(function (reg) {
          console.log('[sw] registered, scope:', reg.scope);
        })
        .catch(function (err) {
          console.warn('[sw] registration failed:', err);
        });
    }
  </script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
