<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <title>claw-code-go — Terminal</title>
  <link rel="stylesheet" href="/static/css/chat.css" />
  <link rel="stylesheet" href="/static/css/terminal.css" />
  <style>
    /* Terminal page overrides: full-height terminal container */
    body {
      grid-template-rows: var(--topbar-height) 1fr;
      grid-template-areas:
        "header"
        "main";
    }
    footer { display: none; }

    #layout {
      grid-area: main;
      display: flex;
      overflow: hidden;
    }

    #term-wrap {
      flex: 1 1 auto;
      min-height: 0;
      padding: var(--space-sm);
      background: var(--color-bg);
    }

    #terminal {
      width: 100%;
      height: 100%;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      font-size: var(--text-xs);
      pointer-events: none;
      opacity: 0;
      transition: opacity 200ms;
      z-index: 999;
    }
    .toast.show { opacity: 1; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .toast { transition: none; }
    }
  </style>
</head>
<body>
  <header id="top-bar">
    <a href="/" class="header-action-btn" aria-label="Back to chat" title="Back to chat" style="text-decoration:none;">←</a>
    <h1>claw-code-go</h1>
    <span id="connection-status" class="status-pill status-connected">connected</span>
    <button type="button" id="theme-toggle" class="header-action-btn" aria-label="Switch theme" title="Switch theme (system/light/dark)">◐</button>
    <button type="button" id="font-size-toggle" class="header-action-btn" aria-label="Change font size" title="Font size (S/M/L)">A</button>
    <button type="button" id="reconnect-btn" class="header-action-btn" title="Drop the PTY session and start a fresh one" aria-label="New session" style="width:auto;padding:0 var(--space-sm);font-weight:600;">↻</button>
  </header>

  <div id="layout">
    <main id="term-wrap"><div id="terminal" role="textbox" aria-label="Terminal"></div></main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ── Theme support (shared with chat page) ─────────────── */
    (function() {
      var THEME_KEY = 'claw_theme';
      var saved = localStorage.getItem(THEME_KEY);
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>

  <script>
    /* ── Font size support (shared with chat page) ────────── */
    (function() {
      var FONT_SIZE_KEY = 'claw_font_size';
      var saved = localStorage.getItem(FONT_SIZE_KEY);
      if (saved === 's' || saved === 'l') {
        document.documentElement.setAttribute('data-font-size', saved);
      }
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "@wterm/core": "/static/js/@wterm/core/index.js",
      "@wterm/dom":  "/static/js/@wterm/dom/index.js"
    }
  }
  </script>
  <script type="module">
    import { WTerm } from "/static/js/@wterm/dom/wterm.js";

    const termEl   = document.getElementById("terminal");
    const statusEl = document.getElementById("connection-status");
    const toastEl  = document.getElementById("toast");
    const reconnectBtn = document.getElementById("reconnect-btn");

    function setStatus(state) {
      var labels = {
        'connected':     '✓ connected',
        'reconnecting':  '↻ reconnecting',
        'disconnected':  '✗ disconnected',
        'error':         '✗ error'
      };
      statusEl.className = 'status-pill status-' + state;
      statusEl.textContent = labels[state] || state;
    }

    let toastTimer;
    function toast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toastEl.classList.remove("show"); }, 2000);
    }

    const term = new WTerm(termEl, {
      cols: 80,
      rows: 24,
      autoResize: true,
      cursorBlink: true,
      wasmUrl: "/static/wasm/wterm.wasm",
    });
    await term.init();
    term.focus();

    console.log("[wterm] cols=" + term.cols + " rows=" + term.rows);

    function sendResize(cols, rows) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "resize", cols: cols, rows: rows }));
      }
    }

    term.onResize = function(cols, rows) { sendResize(cols, rows); };

    let ws;
    function connect() {
      var proto = location.protocol === "https:" ? "wss:" : "ws:";
      var url = proto + "//" + location.host + "/ws";
      ws = new WebSocket(url);
      ws.binaryType = "arraybuffer";
      setStatus("reconnecting");

      ws.onopen = function() {
        setStatus("connected");
        sendResize(term.cols, term.rows);
      };
      ws.onmessage = function(e) {
        var data = e.data instanceof ArrayBuffer
          ? new TextDecoder().decode(e.data)
          : e.data;
        term.write(data);
      };
      ws.onerror = function() { setStatus("error"); };
      ws.onclose = function() {
        setStatus("disconnected");
        setTimeout(connect, 1000);
      };
    }

    term.onData = function(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(data);
      }
    };

    connect();

    reconnectBtn.addEventListener("click", function() {
      if (ws) ws.close();
      term.write("\x1b[2J\x1b[H");
      setTimeout(connect, 250);
    });

    window.addEventListener("beforeunload", function() {
      try { ws && ws.close(); } catch(_) {}
    });

    /* ── Theme toggle ─────────────────────────────────────── */
    (function() {
      var THEME_KEY = 'claw_theme';
      var THEME_CYCLE = ['system', 'light', 'dark'];
      var themeToggle = document.getElementById('theme-toggle');
      var labels = { system: '◐', light: '☀', dark: '☾' };

      function getCurrentTheme() {
        return document.documentElement.getAttribute('data-theme') || 'system';
      }

      function applyTheme(theme) {
        if (theme === 'system') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
        localStorage.setItem(THEME_KEY, theme);
        themeToggle.textContent = labels[theme] || '◐';
      }

      function cycleTheme() {
        var current = getCurrentTheme();
        var idx = THEME_CYCLE.indexOf(current);
        var next = THEME_CYCLE[(idx + 1) % THEME_CYCLE.length];
        applyTheme(next);
      }

      var saved = localStorage.getItem(THEME_KEY);
      if (saved && (saved === 'light' || saved === 'dark')) {
        applyTheme(saved);
      } else {
        themeToggle.textContent = labels['system'];
      }

      themeToggle.addEventListener('click', cycleTheme);
    })();

    /* ── Font size toggle ─────────────────────────────────── */
    (function() {
      var FONT_SIZE_KEY = 'claw_font_size';
      var FONT_SIZE_CYCLE = ['s', 'm', 'l'];
      var fontSizeToggle = document.getElementById('font-size-toggle');
      var labels = { s: 'S', m: 'M', l: 'L' };

      function getCurrentFontSize() {
        return document.documentElement.getAttribute('data-font-size') || 'm';
      }

      function applyFontSize(size) {
        if (size === 'm') {
          document.documentElement.removeAttribute('data-font-size');
        } else {
          document.documentElement.setAttribute('data-font-size', size);
        }
        localStorage.setItem(FONT_SIZE_KEY, size);
        fontSizeToggle.textContent = labels[size] || 'A';
        fontSizeToggle.style.fontWeight = size === 'l' ? '700' : '500';
        fontSizeToggle.style.fontSize = size === 's' ? '0.7rem' : size === 'l' ? '0.95rem' : '0.85rem';
      }

      function cycleFontSize() {
        var current = getCurrentFontSize();
        var idx = FONT_SIZE_CYCLE.indexOf(current);
        var next = FONT_SIZE_CYCLE[(idx + 1) % FONT_SIZE_CYCLE.length];
        applyFontSize(next);
      }

      var saved = localStorage.getItem(FONT_SIZE_KEY);
      if (saved === 's' || saved === 'l') {
        applyFontSize(saved);
      } else {
        fontSizeToggle.textContent = 'M';
      }

      fontSizeToggle.addEventListener('click', cycleFontSize);
    })();
  </script>
</body>
</html>
