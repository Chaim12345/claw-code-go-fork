name: Phase 8 — UAT / UI / UX CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      e2e_base_url:
        description: 'Override base URL for E2E tests (default: http://127.0.0.1:7777)'
        required: false

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'
  E2E_BASE_URL: ${{ github.event.inputs.e2e_base_url || 'http://127.0.0.1:7777' }}

jobs:
  # ── Build & Unit Tests ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: go build ./cmd/claw-code-go/

      - name: Run Go tests
        run: go test ./... -short -timeout 60s

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: claw-code-go-linux-amd64
          path: claw-code-go

  # ── Cross-browser E2E (Chromium, Firefox, WebKit) ──────────────
  e2e-cross-browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - uses: actions/download-artifact@v4
        with:
          name: claw-code-go-linux-amd64

      - name: Make binary executable
        run: chmod +x claw-code-go

      - name: Start web server
        run: |
          DEEPSEEK_TOKEN=${{ secrets.DEEPSEEK_TOKEN }} \
          ./claw-code-go web --addr 127.0.0.1:7777 --provider deepseek --delta=true &
          sleep 3
          curl -sf http://127.0.0.1:7777/healthz || (echo "Server failed to start"; exit 1)

      - name: Run UAT smoke test (${{ matrix.browser }})
        run: |
          E2E_BASE_URL=$E2E_BASE_URL npx playwright test \
            --config web/e2e/playwright.config.ts \
            --project=${{ matrix.browser }} \
            web/e2e/uat.spec.ts
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.browser }}
          path: web/e2e/test-results/
          retention-days: 30

  # ── Responsive design visual check (5 breakpoints × 2 themes) ─
  e2e-responsive:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: claw-code-go-linux-amd64

      - name: Make binary executable
        run: chmod +x claw-code-go

      - name: Start web server
        run: |
          DEEPSEEK_TOKEN=${{ secrets.DEEPSEEK_TOKEN }} \
          ./claw-code-go web --addr 127.0.0.1:7777 --provider deepseek --delta=true &
          sleep 3

      - name: Run responsive visual tests
        run: |
          E2E_BASE_URL=$E2E_BASE_URL npx playwright test \
            --config web/e2e/playwright.config.ts \
            --project=chromium \
            web/e2e/responsive.spec.ts

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: web/e2e/baselines/responsive/
          retention-days: 30

  # ── Accessibility audit (axe-core) ─────────────────────────────
  e2e-accessibility:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: claw-code-go-linux-amd64

      - name: Make binary executable
        run: chmod +x claw-code-go

      - name: Start web server
        run: |
          DEEPSEEK_TOKEN=${{ secrets.DEEPSEEK_TOKEN }} \
          ./claw-code-go web --addr 127.0.0.1:7777 --provider deepseek --delta=true &
          sleep 3

      - name: Run accessibility audit
        run: |
          E2E_BASE_URL=$E2E_BASE_URL npx playwright test \
            --config web/e2e/playwright.config.ts \
            --project=chromium \
            web/e2e/accessibility.spec.ts

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: web/e2e/test-results/
          retention-days: 30

  # ── Load / stress test (10 concurrent WS connections) ──────────
  e2e-load:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: claw-code-go-linux-amd64

      - name: Make binary executable
        run: chmod +x claw-code-go

      - name: Start web server
        run: |
          DEEPSEEK_TOKEN=${{ secrets.DEEPSEEK_TOKEN }} \
          ./claw-code-go web --addr 127.0.0.1:7777 --provider deepseek --delta=true &
          sleep 3

      - name: Run load test
        run: |
          E2E_BASE_URL=$E2E_BASE_URL npx playwright test \
            --config web/e2e/playwright.config.ts \
            --project=chromium \
            web/e2e/load.spec.ts

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: web/e2e/test-results/
          retention-days: 30

  # ── Error recovery test ────────────────────────────────────────
  e2e-error-recovery:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: claw-code-go-linux-amd64

      - name: Make binary executable
        run: chmod +x claw-code-go

      - name: Start web server
        run: |
          DEEPSEEK_TOKEN=${{ secrets.DEEPSEEK_TOKEN }} \
          ./claw-code-go web --addr 127.0.0.1:7777 --provider deepseek --delta=true &
          sleep 3

      - name: Run error recovery test
        run: |
          E2E_BASE_URL=$E2E_BASE_URL npx playwright test \
            --config web/e2e/playwright.config.ts \
            --project=chromium \
            web/e2e/error-recovery.spec.ts

      - name: Upload error recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-recovery-report
          path: web/e2e/test-results/
          retention-days: 30
